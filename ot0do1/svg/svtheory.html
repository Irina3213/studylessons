<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="box">
      <svg class="svg">
        <rect
          width="200px"
          height="150px"
          fill="yellow"
          x="100"
          y="150"
          rx="20"
          ry="40"
        ></rect>
      </svg>
      <svg class="svg">
        <circle
          r="100"
          fill="red"
          cx="50%"
          cy="50%"
          stroke="yellow"
          stroke-width="10"
        />
      </svg>
      <svg class="svg">
        <ellipse rx="50" ry="100" fill="gold" cx="50%" cy="50%" />
      </svg>
      <svg class="svg">
        <polygon points="50, 50 350,50 200,250" fill="silver" />
      </svg>
      <svg class="svg">
        <line x1="50" y1="50" x2="350" y2="250" stroke="pink" />
      </svg>
      <svg class="svg">
        <polyline
          points="50,50 50,150 150,150 150,50 250,50 350,250"
          fill="none"
          stroke="orange"
          stroke-width="10"
        />
      </svg>
    </div>
    <svg class="icon">
      <use href="./images/sprite.svg#instagram"></use>
    </svg>
    <svg class="icon">
      <use href="./images/sprite.svg#facebook"></use>
    </svg>
    <svg class="icon">
      <use href="./images/sprite.svg#linkedin"></use>
    </svg>
    <svg class="icon">
      <use class="icon-use" href="./images/sprite.svg#twitter"></use>
    </svg>
  </body>
</html>
